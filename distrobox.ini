# Distrobox manifest for development environments
# Usage: distrobox assemble create --file distrobox.ini
#        distrobox assemble rm --file distrobox.ini


[android-dev]
image="registry.fedoraproject.org/fedora-toolbox:41"
home="${HOME}/.local/share/distrobox-homes/android-dev"
volume="${HOME}/Workspace:${HOME}/Workspace:rw"
additional_flags="--device /dev/kvm --device /dev/dri"
init=false
nvidia=false
pull=true
root=false

[java-dev]
image="registry.fedoraproject.org/fedora-toolbox:41"
home="${HOME}/.local/share/distrobox-homes/java-dev"
volume="${HOME}/Workspace:${HOME}/Workspace:rw"
additional_flags="--device /dev/kvm --device /dev/dri"
init=false
nvidia=false
pull=true
root=false
