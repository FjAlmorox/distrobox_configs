name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Optimize resource consumption: cancel redundant in-progress runs when a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict permissions to read-only for maximum security
permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Lint, Syntax & Security Audit
    # Standard GitHub-hosted Linux runner: 100% free and unlimited on public repos.
    # Uses the standard compute allocation (2 vCPU, 7 GB RAM) with minimal start-up overhead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends shellcheck

      - name: Run sandbox structural, syntax & script validation
        run: |
          chmod +x tests/validate-sandboxes.sh .githooks/pre-commit .githooks/pre-push
          ./tests/validate-sandboxes.sh --strict

      - name: Run repository privacy & secrets audit
        run: |
          ./.githooks/pre-commit --all

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
